on:
  release:
    types:
      - published
  
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        target_type:
          - client
    steps:
      - uses: actions/checkout@v7

      - uses: xmake-io/github-action-setup-xmake@v1
        # with:
        #   xmake-version: branch@master

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - run: |
          xmake repo -u

      - run: |
          xmake f -a x64 -m release -p windows --target_type=${{ matrix.target_type }} -y

      - run: |
          xmake -w -y

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-client-windows-x64
          path: |
            bin/NoCheatTabComplete/

  update-release-notes:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: ${{ github.event.repository.name }}-${{ github.sha }}-*-windows-x64
          path: ./artifacts/
          merge-multiple: true

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p ./release-assets
          for dir in ./artifacts/*; do
            if [ -d "$dir" ]; then
              base_name=$(basename "$dir")
              zip_name="${base_name}.zip"
              (cd "$dir" && zip -r "../../release-assets/${zip_name}" .)
              echo "Created release-assets/${zip_name}"
            fi
          done

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: ./release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
